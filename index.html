<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ead0cf">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Harleen & Akashdeep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <!-- Opening scene -->
  <section class="opening" id="opening" aria-label="Sealed invitation">
    <div class="ambient-leaf leaf-left">❦</div>
    <div class="ambient-leaf leaf-right">❧</div>
    <div class="tiny-bird b1">⌁</div>
    <div class="tiny-bird b2">⌁</div>

    <div class="opening-copy">
      <div class="smallcaps">A LITTLE SOMETHING, SEALED WITH LOVE</div>
      <div class="opening-title">For you, with love</div>
    </div>

    <div class="envelope-stage">
      <div class="envelope" id="envelope">
        <div class="envelope-back"></div>

        <div class="inside-card" id="insideCard">
          <div class="inside-card-inner">
            <span>H</span><i>✦</i><span>A</span>
          </div>
        </div>

        <div class="envelope-pocket"></div>

        <div class="flap" id="flap">
          <div class="flap-highlight"></div>
          <div class="flap-message">with love</div>
        </div>

        <button class="wax-seal" id="seal" aria-label="Open the invitation">
          <span class="seal-ring"></span>
          <span class="seal-h">H</span>
          <span class="seal-star">✦</span>
          <span class="seal-a">A</span>
        </button>
      </div>
    </div>

    <button class="open-label" id="openLabel">tap the seal to open</button>
    <div class="date-line">October 14, 2026&nbsp; · &nbsp;5:00 PM</div>
  </section>

  <!-- Living invitation scene -->
  <section class="invite" id="invite" aria-hidden="true">
    <div class="invite-bg"></div>
    <div class="warm-glow"></div>

    <!-- tiny animated birds: intentionally slow and understated -->
    <div class="scene-bird sb1">⌁</div>
    <div class="scene-bird sb2">⌁</div>
    <div class="scene-bird sb3">⌁</div>
    <div class="scene-bird sb4">⌁</div>
    <div class="scene-bird sb5">⌁</div>

    <!-- gentle floating petals / pollen -->
    <div class="petal p1">·</div><div class="petal p2">·</div><div class="petal p3">·</div>
    <div class="petal p4">·</div><div class="petal p5">·</div>

    <div class="invite-frame">
      <img src="assets/invite.jpg" alt="Harleen and Akashdeep invitation">
      <div class="paper-light"></div>
    </div>

    <button class="replay" id="replay" aria-label="Replay envelope opening">↻</button>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
